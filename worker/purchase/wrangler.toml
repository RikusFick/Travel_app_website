name = "earwise-purchase"
main = "src/index.js"
compatibility_date = "2026-11-22"

# Create a KV namespace and paste its id here before deploy:
#   wrangler kv namespace create ENTITLEMENTS
kv_namespaces = [
  { binding = "ENTITLEMENTS", id = "ae8e9a1c8f2c472e82fa2c099fd95dd5" }
]

# Set secrets with wrangler (never commit them):
#   wrangler secret put PAYSTACK_SECRET_KEY
#     (value is the test secret in box env PAYSTACK_TEST_SECRET_KEY — do not print it)
#   wrangler secret put FIREBASE_WEB_API_KEY
#   wrangler secret put QUOTE_SIGNING_KEY
#     (random HMAC-SHA256 key for stateless checkout quotes; pipe from stdin, never print or commit)
# Optional:
#   wrangler secret put PAYSTACK_WEBHOOK_SECRET
# Vars that are not secret:
[vars]
FIREBASE_PROJECT_ID = "earwise-app"
SITE_ORIGIN = "https://getearwise.com"
# Charge currency is ZAR at a daily EUR to ZAR rate (see src/currency.json). 19.25 is only a fallback.
